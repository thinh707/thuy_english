# Cấu hình nginx cho Sổ học tiếng Anh (trang tĩnh, không cần backend).
# Dùng trong Docker (xem Dockerfile) hoặc chép vào /etc/nginx/sites-available/ trên server
# rồi sửa `root` thành thư mục đã git clone.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Mở tên miền là vào thẳng trang học
    location = / {
        return 302 /So_hoc_tieng_Anh/Mo_trang_hoc.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Không lộ file cấu hình trong repo (đặt trước các location regex khác: nginx dùng regex khớp đầu tiên)
    location ~ /\.(git|claude|superpowers) { deny all; }
    location ~* ^/(CLAUDE|README)\.md$ { deny all; }
    location ~* ^/(Dockerfile|docker-compose\.yml|deploy/) { deny all; }

    # Trang và dữ liệu buổi học: luôn hỏi lại server để thấy buổi mới ngay sau khi git pull
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Âm thanh: cache lâu, hỗ trợ tua (Range) mặc định
    location ~* \.(mp3|m4a|ogg|wav)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_types text/html application/javascript text/css application/json;
}
